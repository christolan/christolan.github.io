<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset=".54" stop-color="#101827"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65d6d8"/><stop offset=".62" stop-color="#8b7cf6"/><stop offset="1" stop-color="#f1b56a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65d6d8"/></marker>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC',sans-serif;font-size:42px;font-weight:760;fill:#edf4fb;letter-spacing:-.8px}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC',sans-serif;font-size:21px;fill:#9fb0c3}
      .label{font-family:'SF Mono','Cascadia Code','Noto Sans Mono',monospace;font-size:18px;fill:#9fb0c3;letter-spacing:.5px}
      .small{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;font-size:24px;font-weight:650;fill:#d8e3ee;text-anchor:middle}
      .tiny{font-family:'SF Mono','Cascadia Code','Noto Sans Mono',monospace;font-size:16px;fill:#94a4b7;text-anchor:middle}
      .node rect{fill:#111d2c;stroke:#344b67;stroke-width:1.5}
      .node.strong rect{fill:#16243a;stroke:#65d6d8;filter:url(#glow)}
      .node text,.chip text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;font-size:20px;font-weight:650;fill:#dbe6f1;text-anchor:middle}
      .chip rect{fill:#172638;stroke:#38506b;stroke-width:1}
      .arrow{fill:none;stroke:#65d6d8;stroke-width:3;marker-end:url(#arrowHead);stroke-linecap:round}
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".24"><path d="M80 110H1120M80 250H1120M80 390H1120M80 530H1120M150 70V570M330 70V570M510 70V570M690 70V570M870 70V570M1050 70V570" stroke="#334155" stroke-width="1"/></g>
  <circle cx="1010" cy="118" r="185" fill="#65d6d8" opacity=".08"/><circle cx="190" cy="520" r="210" fill="#8b7cf6" opacity=".07"/>
  <text x="72" y="82" class="subtitle">煎饼果子不放葱 · AI Native Interview</text>
  <text x="72" y="132" class="title">LLM 解码策略</text>
  <text x="74" y="578" class="subtitle">从概率分布里选择下一个 token</text>
  
  <g transform="translate(110,205)">
    <text x="0" y="-42" class="label">Logits → Softmax → Token Selection</text>
    <path d="M0 170 C90 45 150 85 220 32 C295 -25 348 30 420 98 C500 174 560 55 660 78 C730 95 785 138 845 18" fill="none" stroke="url(#lineGrad)" stroke-width="5" opacity=".95"/>
    <g opacity=".95">
      <circle cx="0" cy="170" r="9" fill="#65d6d8"/><circle cx="220" cy="32" r="12" fill="#f1b56a"/><circle cx="420" cy="98" r="10" fill="#8b7cf6"/><circle cx="660" cy="78" r="8" fill="#65d6d8"/><circle cx="845" cy="18" r="13" fill="#f1b56a"/>
    </g>
    <g class="chip"><rect x="70" y="205" width="160" height="46" rx="18"/><text x="150" y="235">temperature</text></g>
    <g class="chip"><rect x="270" y="205" width="105" height="46" rx="18"/><text x="322" y="235">top-p</text></g>
    <g class="chip"><rect x="415" y="205" width="105" height="46" rx="18"/><text x="467" y="235">top-k</text></g>
    <g class="chip"><rect x="560" y="205" width="150" height="46" rx="18"/><text x="635" y="235">beam search</text></g>
